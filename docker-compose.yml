services:
  postgres:
    image: postgres:16-alpine
    container_name: paperless-meeting-postgres
    environment:
      POSTGRES_DB: paperless_meeting
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: paperless
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

